name: Restock Central Key

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reposição
        env:
          SELLTRUST_API_TOKEN: ${{ secrets.SELLTRUST_API_TOKEN }}
          CENTRALKEY_API_TOKEN: ${{ secrets.CENTRALKEY_API_TOKEN }}
        run: python -u tools/restock.py
