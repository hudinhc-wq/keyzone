<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Key Zone</title>
  <link rel="icon" type="image/png" href="images/keyzone-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
  <style>
    @font-face {
      font-family: Poppins;
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url("fonts/poppins_n4.0ba78fa5af9b0e1a374041b3ceaadf0a43b41362.woff2") format("woff2"),
           url("fonts/poppins_n4.214741a72ff2596839fc9760ee7a770386cf16ca.woff") format("woff");
    }
    @font-face {
      font-family: Poppins;
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url("fonts/poppins_n7.56758dcf284489feb014a026f3727f2f20a54626.woff2") format("woff2"),
           url("fonts/poppins_n7.f34f55d9b3d3205d2cd6f64955ff4b36f0cfd8da.woff") format("woff");
    }

    :root {
      --bg: #070605;
      --card: #121214;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f5f5f6;
      --muted: #9a9aa2;
      --faint: #6d6d75;
      --orange: #ff7a00;
      --orange-hot: #ff8f26;
      --field: #0c0c0e;
      --field-line: #2c2c31;
      --danger: #ff5d6c;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Poppins, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    .stage {
      --mx: 0;
      --my: 0;
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(900px 520px at 8% 70%, rgba(255, 110, 0, 0.16), transparent 60%),
        radial-gradient(700px 480px at 92% 28%, rgba(255, 90, 0, 0.14), transparent 62%),
        linear-gradient(180deg, #0c0b0a 0%, #090807 42%, #070605 100%);
    }

    .glow, .spark, .floor, .gallery { pointer-events: none; }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(8px);
    }
    .glow--left {
      width: 280px;
      height: 140px;
      left: -40px;
      top: 46%;
      background: radial-gradient(ellipse, rgba(255, 120, 20, 0.55), transparent 70%);
      filter: blur(18px);
    }
    .glow--right {
      width: 360px;
      height: 220px;
      right: -60px;
      top: 8%;
      background: radial-gradient(ellipse, rgba(255, 100, 0, 0.4), transparent 68%);
      filter: blur(22px);
    }

    .spark {
      position: absolute;
      width: 7px;
      height: 7px;
      background: #ff8c1a;
      box-shadow: 0 0 14px 2px rgba(255, 130, 20, 0.85);
      opacity: 0.85;
      animation: spark 5.5s ease-in-out infinite;
    }
    .spark--1 { left: 7%; top: 58%; animation-delay: 0s; }
    .spark--2 { left: 14%; top: 72%; width: 5px; height: 5px; animation-delay: 1.2s; }
    .spark--3 { left: 4%; top: 34%; width: 4px; height: 4px; animation-delay: 2s; }
    .spark--4 { right: 6%; bottom: 18%; animation-delay: 0.6s; }
    .spark--5 { right: 18%; bottom: 12%; width: 5px; height: 5px; animation-delay: 1.8s; }
    .spark--6 { left: 22%; bottom: 8%; width: 4px; height: 4px; animation-delay: 2.6s; }

    @keyframes spark {
      0%, 100% { transform: translateY(0); opacity: 0.35; }
      50% { transform: translateY(-10px); opacity: 1; }
    }

    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58%;
      z-index: 1;
      perspective: calc(560px + var(--mx) * 28px);
      overflow: hidden;
      background: radial-gradient(ellipse 58% 34% at 50% 68%, rgba(255, 120, 0, 0.045), transparent 72%);
      transform:
        translate3d(calc(var(--mx) * 10px), calc(var(--my) * 3px), 0)
        rotateY(calc(var(--mx) * -1.6deg))
        rotateX(calc(var(--my) * 0.8deg));
    }
    .floor::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        transparent 40%,
        rgba(7, 6, 5, 0.16) 56%,
        rgba(7, 6, 5, 0.4) 70%,
        rgba(7, 6, 5, 0.66) 82%,
        rgba(7, 6, 5, 0.88) 93%,
        #070605 100%
      );
    }
    .floor__grid {
      position: absolute;
      left: -55%;
      width: 210%;
      height: 230%;
      bottom: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.13) 1px, transparent 1px);
      background-size: 78px 78px;
      transform: rotateX(71deg);
      transform-origin: center bottom;
      -webkit-mask-image: linear-gradient(to top, #000 0%, #000 30%, rgba(0, 0, 0, 0.55) 62%, rgba(0, 0, 0, 0.18) 82%, transparent 100%);
      mask-image: linear-gradient(to top, #000 0%, #000 30%, rgba(0, 0, 0, 0.55) 62%, rgba(0, 0, 0, 0.18) 82%, transparent 100%);
    }

    .gallery {
      position: absolute;
      z-index: 1;
      top: 0;
      bottom: 0;
      left: 48%;
      right: -36px;
      perspective: 1200px;
      perspective-origin: 20% 42%;
    }
    .art-card {
      position: absolute;
      margin: 0;
      border-radius: 18px;
      overflow: hidden;
      background: #111;
      box-shadow:
        0 28px 60px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 170, 80, 0.16);
      transform: rotateY(var(--ry)) rotateX(var(--rx)) rotateZ(var(--rz)) translateY(0);
      animation: card-float var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
      will-change: transform;
    }
    .art-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .art-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 140, 40, 0.05), transparent 28%, rgba(0, 0, 0, 0.28));
    }
    @keyframes card-float {
      0%, 100% { transform: rotateY(var(--ry)) rotateX(var(--rx)) rotateZ(var(--rz)) translateY(0); }
      50% { transform: rotateY(var(--ry)) rotateX(var(--rx)) rotateZ(var(--rz)) translateY(var(--lift)); }
    }

    .art-card--1 { width: 280px; height: 176px; left: 0%; top: 22%; --ry: -32deg; --rx: 8deg; --rz: -5deg; --lift: -14px; --dur: 8.4s; --delay: 0s; z-index: 1; }
    .art-card--2 { width: 320px; height: 200px; left: 16%; top: 8%; --ry: -26deg; --rx: 6deg; --rz: 2deg; --lift: -18px; --dur: 9.2s; --delay: -1.6s; z-index: 3; }
    .art-card--3 { width: 360px; height: 226px; left: 30%; top: 30%; --ry: -20deg; --rx: 5deg; --rz: -2deg; --lift: -12px; --dur: 7.8s; --delay: -2.4s; z-index: 5; }
    .art-card--4 { width: 300px; height: 188px; left: 52%; top: 12%; --ry: -16deg; --rx: 7deg; --rz: 3deg; --lift: -16px; --dur: 8.8s; --delay: -0.8s; z-index: 4; }
    .art-card--5 { width: 280px; height: 176px; left: 68%; top: 40%; --ry: -12deg; --rx: 4deg; --rz: -3deg; --lift: -13px; --dur: 9.6s; --delay: -3.1s; z-index: 2; }

    .shell {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 32px 7vw 40px;
    }

    .panel {
      width: min(420px, 100%);
      background: #141416;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 32px 28px 22px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }

    .home {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 52px;
      padding: 0 22px 0 16px;
      border-radius: 0 0 18px 0;
      background: var(--orange);
      color: #fff;
      font: 700 15px/1 Poppins, sans-serif;
      text-decoration: none;
      box-shadow: 0 14px 32px rgba(255, 122, 0, 0.48);
    }
    .home:hover { background: var(--orange-hot); color: #fff; }
    .home svg { width: 18px; height: 18px; flex: none; }

    .brand {
      display: inline-flex;
      margin-bottom: 22px;
    }
    .brand img {
      height: 42px;
      width: auto;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .lead {
      margin: 8px 0 22px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
    }

    .social {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .social button {
      height: 46px;
      border-radius: 10px;
      border: 1px solid #34343a;
      background: #161618;
      color: var(--text);
      font: 500 14px/1 Poppins, sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }
    .social button:hover { background: #1c1c20; border-color: #45454d; }
    .social svg { width: 18px; height: 18px; flex: none; }

    .divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin: 16px 0 18px;
      color: var(--faint);
      font-size: 13px;
    }
    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #2a2a30;
    }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #e4e4e7;
    }
    .control {
      position: relative;
    }
    .control svg.icon {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 16px;
      height: 16px;
      transform: translateY(-50%);
      color: #8d8d96;
      pointer-events: none;
    }
    .control input {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      border: 1px solid var(--field-line);
      background: var(--field);
      color: var(--text);
      font: 400 14px/1 Poppins, sans-serif;
      padding: 0 44px 0 42px;
      outline: none;
    }
    .control input::placeholder { color: #6a6a72; }
    .control input:focus { border-color: #ff9a3d; box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.16); }
    .field.is-invalid .control input { border-color: var(--danger); }
    .error {
      min-height: 0;
      margin: 6px 0 0;
      color: var(--danger);
      font-size: 12px;
    }
    .error:empty { display: none; }

    .ghost {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: #9a9aa2;
      cursor: pointer;
      display: grid;
      place-items: center;
      border-radius: 8px;
    }
    .ghost:hover { color: #fff; }
    .ghost svg { width: 18px; height: 18px; }

    .forgot {
      display: flex;
      justify-content: flex-end;
      margin: -4px 0 16px;
    }
    .forgot button,
    .back {
      border: 0;
      background: none;
      padding: 0;
      color: var(--orange);
      font: 500 13px/1 Poppins, sans-serif;
      cursor: pointer;
    }
    .forgot button:hover,
    .back:hover,
    .signup a:hover,
    .terms:hover { color: var(--orange-hot); }

    .submit {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 10px;
      background: var(--orange);
      color: #fff;
      font: 700 15px/1 Poppins, sans-serif;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(255, 122, 0, 0.28);
    }
    .submit:hover { background: var(--orange-hot); }
    .submit:active { transform: translateY(1px); }

    .status {
      margin: 12px 0 0;
      font-size: 13px;
      color: #d7d7dc;
      text-align: center;
    }
    .status:empty { display: none; }
    .status.is-ok { color: #b6f3c6; }

    .signup {
      margin: 18px 0 8px;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
    }
    .signup a {
      color: var(--orange);
      font-weight: 600;
      text-decoration: none;
    }
    .terms {
      display: block;
      text-align: center;
      color: #8b8b93;
      font-size: 12.5px;
      text-decoration: none;
      margin-top: 6px;
    }

    .view[hidden] { display: none; }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 2px solid #ff9a3d;
      outline-offset: 2px;
    }

    @media (min-width: 1280px) {
      .shell { padding-left: max(48px, calc(46vw - 420px)); }
    }
    @media (min-width: 1600px) {
      .shell { padding-left: calc(50vw - 210px); }
      .gallery { left: calc(50vw + 250px); }
    }
    @media (max-width: 989px) {
      .floor__grid { background-size: 104px 104px; opacity: 0.72; }
    }
    @media (max-width: 1080px) {
      .gallery { opacity: 0.28; width: 70vw; }
      .shell { justify-content: center; padding: 28px 20px 36px; }
    }
    @media (max-width: 760px) {
      .gallery, .floor { display: none; }
      h1 { font-size: 24px; }
      .panel { padding: 26px 18px 18px; border-radius: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .art-card, .spark { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="glow glow--left"></div>
    <div class="glow glow--right"></div>
    <span class="spark spark--1"></span>
    <span class="spark spark--2"></span>
    <span class="spark spark--3"></span>
    <span class="spark spark--4"></span>
    <span class="spark spark--5"></span>
    <span class="spark spark--6"></span>

    <div class="floor" aria-hidden="true"><div class="floor__grid"></div></div>

    <div class="gallery" aria-hidden="true">
      <figure class="art-card art-card--1">
        <img src="images/ark-survival-evolved-playstation-4-game-playstation-store-wallpaper-1.jpg" alt="">
      </figure>
      <figure class="art-card art-card--2">
        <img src="images/black-myth-wukong-playstation-5-playstation-store-wallpaper-1.jpg" alt="">
      </figure>
      <figure class="art-card art-card--3">
        <img src="images/god-of-war-ragnarok-playstation-5-game-playstation-store-europe-wallpaper-1.jpg" alt="">
      </figure>
      <figure class="art-card art-card--4">
        <img src="images/the-last-of-us-part-ii-remastered-pc-steam-wallpaper-1.jpg" alt="">
      </figure>
      <figure class="art-card art-card--5">
        <img src="images/mortal-shell-ii-keyart-psn.jpg" alt="">
      </figure>
    </div>

    <div class="shell">
      <a class="home" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
        Voltar ao início
      </a>
      <section class="panel" aria-labelledby="login-title">
        <a class="brand" href="index.html">
          <img src="images/keyzone-logo.png" alt="Key Zone">
        </a>

        <div class="view" id="view-login">
          <h1 id="login-title">Bem-vindo de volta</h1>
          <p class="lead">Entre na sua conta para continuar.</p>

          <div class="social">
            <button type="button">
              <svg viewBox="0 0 18 18" aria-hidden="true">
                <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
                <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z"/>
              </svg>
              Google
            </button>
            <button type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#5865F2" d="M19.27 5.33A17.1 17.1 0 0 0 14.89 4l-.22.4a15.7 15.7 0 0 1 4.05 1.55 16.4 16.4 0 0 0-4.9-1.52A12.6 12.6 0 0 0 9.1 4.4 16.5 16.5 0 0 0 4.2 5.95 17.4 17.4 0 0 0 .7 16.1a16.7 16.7 0 0 0 5.06 2.56l.64-1.05a10.9 10.9 0 0 1-1.9-1.3c.16-.12.31-.24.46-.37a11.9 11.9 0 0 0 10.16 0c.15.13.3.25.46.37-.6.5-1.24.94-1.9 1.3l.63 1.05a16.7 16.7 0 0 0 5.07-2.56 17.4 17.4 0 0 0-3.5-10.77zM8.34 14.57c-.99 0-1.8-.92-1.8-2.05s.8-2.05 1.8-2.05 1.82.93 1.8 2.05c0 1.13-.8 2.05-1.8 2.05zm7.32 0c-.99 0-1.8-.92-1.8-2.05s.8-2.05 1.8-2.05 1.82.93 1.8 2.05c0 1.13-.8 2.05-1.8 2.05z"/>
              </svg>
              Discord
            </button>
          </div>

          <div class="divider">ou</div>

          <form id="login-form" novalidate>
            <div class="field" id="email-field">
              <label for="email">E-mail</label>
              <div class="control">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <path d="M3 7l9 7 9-7"></path>
                </svg>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="Digite seu e-mail" aria-describedby="email-error">
              </div>
              <p class="error" id="email-error"></p>
            </div>

            <div class="field" id="password-field">
              <label for="password">Senha</label>
              <div class="control">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" aria-describedby="password-error">
                <button class="ghost" type="button" id="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
                  <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg id="eye-off" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-1.2"></path>
                    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.4 18.4 0 0 1-3.2 4.2"></path>
                    <path d="M6.1 6.1C3.5 7.8 2 12 2 12a18.7 18.7 0 0 0 6.2 5.6"></path>
                  </svg>
                </button>
              </div>
              <p class="error" id="password-error"></p>
            </div>

            <div class="forgot">
              <button type="button" id="forgot-open">Esqueci minha senha</button>
            </div>

            <button class="submit" type="submit">Entrar</button>
            <p class="status" id="login-status" role="status"></p>
          </form>

          <p class="signup">Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>

        <div class="view" id="view-recover" hidden>
          <h1 id="recover-title">Recuperar senha</h1>
          <p class="lead">Informe o e-mail da conta para receber o link de redefinição.</p>
          <form id="recover-form" novalidate>
            <div class="field" id="recover-email-field">
              <label for="recover-email">E-mail</label>
              <div class="control">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <path d="M3 7l9 7 9-7"></path>
                </svg>
                <input id="recover-email" name="email" type="email" autocomplete="email" placeholder="Digite seu e-mail" aria-describedby="recover-email-error">
              </div>
              <p class="error" id="recover-email-error"></p>
            </div>
            <button class="submit" type="submit">Enviar link</button>
            <p class="status" id="recover-status" role="status"></p>
          </form>
          <p class="signup"><button class="back" type="button" id="forgot-close">Voltar ao login</button></p>
        </div>

        <a class="terms" href="index.html">Termos e Condições</a>
      </section>
    </div>
  </div>

  <script>
    (function () {
      var stage = document.querySelector(".stage");
      var grid = document.querySelector(".floor__grid");
      if (!stage || !grid || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var beltStart = performance.now();
      var beltCell = 78;
      var beltSeconds = 72;
      function syncBelt() {
        var nextCell = 78;
        if (window.matchMedia("(max-width: 989px)").matches) nextCell = 104;
        if (nextCell === beltCell) return;
        var now = performance.now();
        var y = (((now - beltStart) / 1000) % beltSeconds) / beltSeconds * beltCell;
        beltCell = nextCell;
        beltStart = now - ((y % beltCell) / beltCell) * beltSeconds * 1000;
      }
      window.addEventListener("resize", syncBelt);
      function belt(now) {
        var y = (((now - beltStart) / 1000) % beltSeconds) / beltSeconds * beltCell;
        grid.style.backgroundPositionY = y.toFixed(3) + "px";
        requestAnimationFrame(belt);
      }
      requestAnimationFrame(belt);
      var tx = 0, ty = 0, cx = 0, cy = 0, running = false;
      function frame() {
        cx += (tx - cx) * 0.045;
        cy += (ty - cy) * 0.045;
        stage.style.setProperty("--mx", cx.toFixed(4));
        stage.style.setProperty("--my", cy.toFixed(4));
        if (Math.abs(tx - cx) > 0.002 || Math.abs(ty - cy) > 0.002) requestAnimationFrame(frame);
        else running = false;
      }
      function kick() {
        if (running) return;
        running = true;
        requestAnimationFrame(frame);
      }
      stage.addEventListener("pointermove", function (e) {
        var r = stage.getBoundingClientRect();
        tx = (e.clientX - r.left) / r.width - 0.5;
        ty = (e.clientY - r.top) / r.height - 0.5;
        kick();
      });
      stage.addEventListener("pointerleave", function () {
        tx = 0;
        ty = 0;
        kick();
      });
    })();

    const loginView = document.getElementById("view-login");
    const recoverView = document.getElementById("view-recover");
    const title = document.getElementById("login-title");

    function showLogin() {
      recoverView.hidden = true;
      loginView.hidden = false;
      title.id = "login-title";
      document.querySelector(".panel").setAttribute("aria-labelledby", "login-title");
    }
    function showRecover() {
      loginView.hidden = true;
      recoverView.hidden = false;
      document.querySelector(".panel").setAttribute("aria-labelledby", "recover-title");
      document.getElementById("recover-email").focus();
    }

    document.getElementById("forgot-open").addEventListener("click", showRecover);
    document.getElementById("forgot-close").addEventListener("click", showLogin);

    const password = document.getElementById("password");
    const toggle = document.getElementById("toggle-password");
    toggle.addEventListener("click", function () {
      const visible = password.type === "text";
      password.type = visible ? "password" : "text";
      toggle.setAttribute("aria-pressed", String(!visible));
      toggle.setAttribute("aria-label", visible ? "Mostrar senha" : "Ocultar senha");
      document.getElementById("eye-open").hidden = !visible;
      document.getElementById("eye-off").hidden = visible;
    });

    function emailError(value) {
      if (!value) return "Informe seu e-mail.";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return "Digite um e-mail válido.";
      return "";
    }

    function setField(fieldId, errorId, message) {
      const field = document.getElementById(fieldId);
      const error = document.getElementById(errorId);
      field.classList.toggle("is-invalid", Boolean(message));
      error.textContent = message;
      field.querySelector("input").setAttribute("aria-invalid", message ? "true" : "false");
    }

    document.getElementById("login-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      const pass = password.value;
      const emailMsg = emailError(email);
      const passMsg = !pass ? "Informe sua senha." : pass.length < 6 ? "A senha precisa ter pelo menos 6 caracteres." : "";
      setField("email-field", "email-error", emailMsg);
      setField("password-field", "password-error", passMsg);
      const status = document.getElementById("login-status");
      if (emailMsg || passMsg) {
        status.textContent = "";
        status.classList.remove("is-ok");
        return;
      }
      status.textContent = "Não encontramos uma conta com esses dados.";
      status.classList.remove("is-ok");
    });

    document.getElementById("recover-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const email = document.getElementById("recover-email").value.trim();
      const message = emailError(email);
      setField("recover-email-field", "recover-email-error", message);
      const status = document.getElementById("recover-status");
      if (message) {
        status.textContent = "";
        status.classList.remove("is-ok");
        return;
      }
      status.textContent = "Se esse e-mail estiver cadastrado, enviaremos o link de redefinição.";
      status.classList.add("is-ok");
    });
  </script>
</body>
</html>
